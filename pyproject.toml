[project]
name = "rebalancing-frontrun"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anika Harode", email = "anika.harode@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "databento>=0.88.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[tool.uv]
# Rebuild the C++ extension whenever the C++ source or build config changes
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp/**/*.cpp" },
    { file = "cpp/**/*.hpp" },
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
